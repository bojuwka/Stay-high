// Parse + merge identical Polish prompts
const map = new Map();
RAW.trim().split("\n").forEach(line => {
  const i = line.indexOf(" = ");
  if (i < 0) return;
  const pl = line.slice(0, i).trim();
  const en = line.slice(i + 3).split("|").map(s => s.trim());
  map.set(pl, (map.get(pl) || []).concat(en));
});
const WORDS = [...map].map(([pl, en]) => ({ pl, en }));

const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, " ").trim();

let queue = [], cur = null, checked = false, good = 0, total = 0;
const $ = id => document.getElementById(id);

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function next() {
  if (!queue.length) queue = shuffle(WORDS.slice());
  cur = queue.pop();
  checked = false;
  $("pl").textContent = cur.pl;
  $("inp").value = "";
  $("inp").disabled = false;
  $("res").textContent = "";
  $("btn").textContent = "Sprawdź";
  $("inp").focus();
  $("score").textContent = `Wynik: ${good} / ${total}  (zostało w rundzie: ${queue.length})`;
}

function check() {
  const ans = norm($("inp").value);
  const ok = cur.en.some(e => norm(e) === ans);
  total++; if (ok) good++;
  $("res").innerHTML = ok
    ? `<span class="ok">✔ Dobrze</span>`
    : `<span class="bad">✘ Źle.</span> Poprawnie: <b>${cur.en.join(" / ")}</b>`;
  $("inp").disabled = true;
  $("btn").textContent = "Dalej";
  $("score").textContent = `Wynik: ${good} / ${total}  (zostało w rundzie: ${queue.length})`;
  checked = true;
  $("btn").focus();
}

$("btn").onclick = () => checked ? next() : check();
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); $("btn").click(); }
});
next();
</script>
